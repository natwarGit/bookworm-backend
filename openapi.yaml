openapi: 3.0.3
info:
  title: Book Worm E-Commerce Platform API
  description: Enterprise REST API contract for the Book Worm online e-book and book store.
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Local Development Server

paths:
  /books:
    get:
      tags: [Catalogue]
      summary: Browse and filter books (Faceted Search)
      parameters:
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: format
          in: query
          schema: { type: string, enum: [PAPERBACK, HARDCOVER, EBOOK] }
        - name: language
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: query
          in: query
          schema: { type: string }
        - name: sortBy
          in: query
          schema: { type: string, enum: [relevance, price_asc, price_desc] }
      responses:
        '200':
          description: List of books matching criteria

  /books/{id}:
    get:
      tags: [Catalogue]
      summary: Get detailed book information with tentative delivery date
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detailed book response

  /books/recommended:
    get:
      tags: [Catalogue]
      summary: Get recommended books
      responses:
        '200':
          description: Recommended books

  /books/bestsellers:
    get:
      tags: [Catalogue]
      summary: Get bestsellers this month
      responses:
        '200':
          description: Bestseller books

  /books/new-launches:
    get:
      tags: [Catalogue]
      summary: Get newly launched books
      responses:
        '200':
          description: New launch books

  /cart:
    get:
      tags: [Shopping Cart]
      summary: Get active shopping cart
      responses:
        '200':
          description: Current cart contents
    post:
      tags: [Shopping Cart]
      summary: Add item to cart
      responses:
        '200':
          description: Item added
    delete:
      tags: [Shopping Cart]
      summary: Clear cart
      responses:
        '200':
          description: Cart cleared

  /orders:
    post:
      tags: [Orders & Checkout]
      summary: Place order and commit checkout
      responses:
        '201':
          description: Order placed with 48h cancellation window
    get:
      tags: [Orders & Checkout]
      summary: Get user order history
      responses:
        '200':
          description: Order history

  /orders/{orderId}/cancel:
    post:
      tags: [Orders & Checkout]
      summary: Cancel order within 48 hours SLA window
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order cancelled successfully
        '400':
          description: Cancellation window has expired (> 48 hours)
