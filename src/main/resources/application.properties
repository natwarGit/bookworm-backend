# Server Configuration
server.port=8080
server.address=127.0.0.1
spring.application.name=bookworm-backend

# PostgreSQL — uses environment variables with local defaults for development
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:bookworm_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:natwar}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging — show real errors in console
logging.level.com.bookworm=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Seed Data Initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
